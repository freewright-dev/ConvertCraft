# cargo-deny policy. Run with `cargo deny check`; CI runs the same command.

[graph]
# Check every platform the app ships on, not just the host running the check.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
yanked = "deny"
# Every ignore needs a reason and a tracking issue. Remove entries as upgrades land.
ignore = [
    # quick-xml 0.30.0 is pulled in only by eframe's Linux AT-SPI stack
    # (zbus_xml <- zbus-lockstep <- atspi-common), mainly at proc-macro expansion.
    # Converted files never reach it. Tracked in #20: upgrade eframe.
    { id = "RUSTSEC-2026-0194", reason = "Linux accessibility stack only, not reachable from converted files; tracked in #20" },
    { id = "RUSTSEC-2026-0195", reason = "Linux accessibility stack only, not reachable from converted files; tracked in #20" },
    # unsafe-libyaml is the backend of serde_yaml, which parses user YAML.
    # Unmaintained, no known vulnerability. Tracked in #20: move to a maintained YAML crate.
    { id = "RUSTSEC-2024-0449", reason = "unmaintained YAML backend; replacement tracked in #20" },
    # Unmaintained transitive dependencies of eframe; tracked in #20.
    { id = "RUSTSEC-2024-0436", reason = "paste, via eframe; tracked in #20" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, via eframe; tracked in #20" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, via eframe on Linux; tracked in #20" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, via eframe on Linux; tracked in #20" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, via eframe on Linux; tracked in #20" },
]

[licenses]
# Licenses compatible with distributing ConvertCraft under GPL-3.0-only.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = [
    { allow = ["GPL-3.0-only"], crate = "convertcraft" },
    # Bundled UI font files (data, not linked code).
    { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
