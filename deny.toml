# cargo-deny policy. Run with `cargo deny check`; CI runs the same command.

[graph]
# Check every platform the app ships on, not just the host running the check.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
yanked = "deny"
# Every ignore needs a reason. Remove entries as upgrades land.
ignore = [
    # Unmaintained (no known vulnerability) transitive dependencies of eframe with no
    # maintained release upstream yet. Recheck on every eframe upgrade.
    { id = "RUSTSEC-2026-0370", reason = "zvariant, via eframe's Linux accessibility stack; unmaintained, no fix upstream" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, via eframe's Linux accessibility stack; unmaintained, no fix upstream" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, via eframe's Linux accessibility stack; unmaintained, no fix upstream" },
]

[licenses]
# Licenses compatible with distributing ConvertCraft under GPL-3.0-only.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = [
    { allow = ["GPL-3.0-only"], crate = "convertcraft" },
    { allow = ["GPL-3.0-only"], crate = "convertcraft-file-id" },
    # Bundled UI font files (data, not linked code).
    { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
