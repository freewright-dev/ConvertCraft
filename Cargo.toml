[package]
name = "convertcraft"
version = "0.1.0"
edition = "2024"
description = "Local desktop batch converter for images, structured data, audio, and video"
repository = "https://github.com/freewright-dev/ConvertCraft"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
csv = "1"
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
rfd = "0.15"
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"
